# Databricks App resource (App Developer dd07fe27; adopted into the root bundle 2026-11-02, steering 6).
# Moved from app/resources/dam_safety_app.yml; source_code_path is relative to this file (-> <root>/app).
# Root databricks.yml no longer excludes app/**: it syncs app/ minus .venv, node_modules, caches,
# .coverage and app/tests. app/frontend/dist (prebuilt UI) is synced (negated in root .gitignore), so
# run `npm --prefix app/frontend ci && npm --prefix app/frontend run build` before `bundle deploy`.
# Restricted (internal-test-only) datasets stay excluded by the root licensing excludes; the leak test
# (tests/test_license_leak.py) scans app/ as a shipped path.
# Latest values: served from gold.instrument_latest via the SQL warehouse ON BEHALF OF the user (UC row
# filters apply). The optional synced table below stays commented out (SCHEMA_CONTRACT v1.1 §7.3).
# Keys checked against docs.databricks.com/aws/en/dev-tools/bundles/resources (2026-11-02).
# UNVERIFIED: `databricks bundle validate` has NOT been run (no CLI/workspace on the build box).
resources:
  apps:
    dam_safety_app:
      name: dam-safety-${bundle.target}
      description: Dam safety monitoring - portfolio, instruments, alarms, DSSMP/PFM, DSSMR drafts
      source_code_path: ../app
      compute_size: MEDIUM              # KB: Medium (2 vCPU / 6 GB)
      compute_min_instances: 1          # min/max must be set together (CLI >= 1.2.0)
      compute_max_instances: 1
      # On-behalf-of-user scopes only (KB). Add `dashboards.genie` ONLY if a Genie space is attached;
      # the app does not call Genie today.
      user_api_scopes:
        - sql
        - postgres
      config:
        env:
          - name: DAM_CATALOG
            value: ${var.catalog}
          - name: DEMO_MODE
            value: "false"
      resources:
        - name: sql-warehouse
          description: Analytics reads (OBO, UC row filters apply)
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: lakebase
          description: App state (acks, onboarding drafts, users/ACL, audit outbox) - service principal writes
          postgres:
            branch: ${resources.postgres_branches.dam_lakebase_production.name}
            database: ${resources.postgres_branches.dam_lakebase_production.name}/databases/databricks_postgres
            permission: CAN_CONNECT_AND_CREATE
      permissions:
        - group_name: dam-portfolio-all
          level: CAN_USE
        - group_name: dam-platform-admins
          level: CAN_MANAGE

  # OPTIONAL / UNVERIFIED - Triggered synced table for the gold latest-value lookup (KB). Keys are
  # from the docs, but (a) it needs a postgres_catalog registered on the branch, (b) TRIGGERED needs
  # change data feed on the source, and gold.instrument_latest is a materialized view (SME to
  # confirm), and (c) the app still reads gold through the warehouse with OBO, so UC row filters
  # apply. Reading the synced copy through the service principal would skip them. Not wired.
  # postgres_synced_tables:
  #   instrument_latest:
  #     synced_table_id: <postgres_catalog>.dam_gold.instrument_latest
  #     source_table_full_name: ${var.catalog}.gold.instrument_latest
  #     primary_key_columns: [sensor_id]
  #     scheduling_policy: TRIGGERED
  #     postgres_database: databricks_postgres
  #     branch: ${resources.postgres_branches.dam_lakebase_production.name}
  #     create_database_objects_if_missing: true
  #     new_pipeline_spec:
  #       storage_catalog: ${var.catalog}
  #       storage_schema: ops

targets:
  prod:
    resources:
      apps:
        dam_safety_app:
          compute_min_instances: 2      # KB: 2+ instances in prod
          compute_max_instances: 4
