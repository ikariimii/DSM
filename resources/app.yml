# Databricks App resource (App Developer dd07fe27; adopted into the root bundle 2026-11-02, steering 6).
# Moved from app/resources/dam_safety_app.yml; source_code_path is relative to this file (-> <root>/app).
# Root databricks.yml no longer excludes app/**: it syncs app/ minus .venv, node_modules, caches,
# .coverage and app/tests. app/frontend/dist (prebuilt UI) is synced (negated in root .gitignore), so
# run `npm --prefix app/frontend ci && npm --prefix app/frontend run build` before `bundle deploy`.
# Restricted (internal-test-only) datasets stay excluded by the root licensing excludes; the leak test
# (tests/test_license_leak.py) scans app/ as a shipped path.
# Latest values: served from gold.instrument_latest via the SQL warehouse ON BEHALF OF the user (UC row
# filters apply). No synced tables: the app never reads gold through Lakebase (a service-principal read would skip
# the row filters), so the earlier commented synced-table block was removed (SME/steering 2026-11-02).
# Keys checked against docs.databricks.com/aws/en/dev-tools/bundles/resources (2026-11-02).
# UNVERIFIED: `databricks bundle validate` has NOT been run (no CLI/workspace on the build box).
resources:
  apps:
    dam_safety_app:
      name: dam-safety-${bundle.target}
      description: Dam safety monitoring - portfolio, instruments, alarms, DSSMP/PFM, DSSMR drafts
      source_code_path: ../app
      compute_size: MEDIUM              # KB: Medium (2 vCPU / 6 GB)
      compute_min_instances: 1          # min/max must be set together (CLI >= 1.2.0)
      compute_max_instances: 1
      # On-behalf-of-user scopes (Databricks SME 2026-11-02): the user token arrives in x-forwarded-access-token
      # and is used only for SQL warehouse reads, so `sql` is the only scope. Lakebase is reached as the app
      # service principal (PG* env + generate_database_credential), never with the user token, so no `postgres`
      # scope. Add `genie` ONLY if a Genie space is attached; the app does not call Genie today.
      user_api_scopes:
        - sql
      config:
        env:
          - name: DAM_CATALOG
            value: ${var.catalog}
          - name: DEMO_MODE
            value: "false"
          # Lakebase endpoint for w.postgres.generate_database_credential(endpoint=...): projects/<p>/branches/<b>/
          # endpoints/<e>. Uses `.id`: docs.databricks.com/aws/en/oltp/projects/manage-with-bundles ("Resource
          # substitutions": `${resources.postgres_branches.<k>.id}` "references the branch resource name") and every
          # example in dev-tools/bundles/resources use `.id`; the API/Terraform `name` is output-only and = the full
          # path, so `.name` probably resolves too but is undocumented (checked 2026-11-02). Still UNVERIFIED by
          # `bundle validate`/deploy, and that bundle config.env overrides the app.yaml value.
          - name: ENDPOINT_NAME
            value: ${resources.postgres_endpoints.dam_lakebase_primary.id}
      resources:
        - name: sql-warehouse
          description: Analytics reads (OBO, UC row filters apply)
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: lakebase
          description: App state (acks, onboarding drafts, users/ACL, audit outbox) - service principal writes
          postgres:
            branch: ${resources.postgres_branches.dam_lakebase_production.id}
            database: ${resources.postgres_branches.dam_lakebase_production.id}/databases/databricks_postgres
            permission: CAN_CONNECT_AND_CREATE
      # Access (SCHEMA_CONTRACT §6): CAN_USE per dam via the same `dam-<dam_id>-members` groups the UC row filter
      # uses, plus dam-platform-admins CAN_MANAGE; never dam-portfolio-all (also not via target-level permissions:
      # QA-037, databricks.yml prod). Bundles cannot loop, so the block below is GENERATED from the dam list by
      # tools/render_app_permissions.py (default sample_data/ref/dam.csv = the five synthetic dams; pass the real
      # ref.dam export or --dam-ids per deployment) and CI fails if it is out of sync (--check).
      # App access is only the front door: data visibility is still the UC row filter, evaluated OBO.
      # BEGIN GENERATED permissions (tools/render_app_permissions.py; do not edit by hand)
      permissions:
        - group_name: dam-SYN-DAM-01-members
          level: CAN_USE
        - group_name: dam-SYN-DAM-02-members
          level: CAN_USE
        - group_name: dam-SYN-DAM-03-members
          level: CAN_USE
        - group_name: dam-SYN-DAM-04-members
          level: CAN_USE
        - group_name: dam-SYN-DAM-05-members
          level: CAN_USE
        - group_name: dam-platform-admins
          level: CAN_MANAGE
      # END GENERATED permissions

targets:
  prod:
    resources:
      apps:
        dam_safety_app:
          compute_min_instances: 2      # KB: 2+ instances in prod
          compute_max_instances: 4
